<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef3f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        a.home-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #2c3e50;
            text-decoration: none;
            font-weight: bold;
        }

        h2 {
            color: #2c3e50;
            font-size: 32px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .form-card {
            background-color: #ffffff;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
            padding: 35px 40px;
            box-sizing: border-box;
            width: 90%;
            max-width: 480px;
            margin: 0 auto;
            text-align: left;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            animation: fadeInUp 0.8s ease-in both;
        }

        .form-card:hover {
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25);
            transform: translateY(-5px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            display: block;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd6dd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 18px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #16a085;
            box-shadow: 0 0 0 3px rgba(22, 160, 133, 0.2);
        }

        /* CSS Grid: Program + Year Level side by side, 1 column on phones */
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0 20px;
        }

        .radio-group,
        .checkbox-group {
            margin-bottom: 18px;
            color: #2c3e50;
        }

        .radio-group label,
        .checkbox-group label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }

        input[type="submit"],
        input[type="reset"] {
            background-color: #2c3e50;
            color: white;
            font-size: 15px;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px 6px 0 0;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background-color: #16a085;
            transform: scale(1.06);
        }

        /* Media queries (SAS) */
        @media (max-width: 600px) {
            h2 { font-size: 26px; }
            .form-card { padding: 25px 20px; }
            input, select, textarea { font-size: 16px; }
        }

        @media (max-width: 480px) {
            .form-card { width: 100%; }
            .form-row { grid-template-columns: 1fr; }
            input[type="submit"],
            input[type="reset"] {
                display: block;
                width: 100%;
                margin: 10px 0 0;
                padding: 12px;
            }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            h2 { margin-bottom: 15px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <a class="home-link" href="index.html">← HOME</a>

    <h2>Student Registration Form</h2>

    <div class="form-card">
        <form>
            <label>Full Name:</label>
            <input type="text" name="fullname">

            <label>Email:</label>
            <input type="email" name="email">

            <label>Password:</label>
            <input type="password" name="password">

            <label>Age:</label>
            <input type="number" name="age">

            <label>Birthdate:</label>
            <input type="date" name="birthdate">

            <label>Mobile Number:</label>
            <input type="tel" name="mobile">

            <div class="form-row">
                <div>
                    <label>Program:</label>
                    <select name="program">
                        <option>BSIT</option>
                        <option>BSCS</option>
                        <option>BSIS</option>
                    </select>
                </div>
                <div>
                    <label>Year Level:</label>
                    <select name="year">
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                    </select>
                </div>
            </div>

            <label>Gender:</label>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="male"><label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female"><label for="female">Female</label>
            </div>

            <label>Programming Skills:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="html" name="skill" value="html"><label for="html">HTML</label>
                <input type="checkbox" id="python" name="skill" value="python"><label for="python">Python</label>
                <input type="checkbox" id="java" name="skill" value="java"><label for="java">Java</label>
                <input type="checkbox" id="css" name="skill" value="css"><label for="css">CSS</label>
            </div>

            <label>Address/Message:</label>
            <textarea name="message" rows="5"></textarea>

            <input type="submit" value="Submit Registration">
            <input type="reset" value="Reset">
        </form>
    </div>
</body>
</html>
