<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG IN</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef3f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        a.home-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #2c3e50;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            color: #2c3e50;
            font-size: 36px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.35);
            margin-bottom: 30px;
        }

        .form-card {
            background-color: #ffffff;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
            padding: 35px 30px;
            box-sizing: border-box;
            width: 90%;
            max-width: 380px;
            margin: 0 auto;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            animation: fadeInUp 0.8s ease-in both;
        }

        .form-card:hover {
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25);
            transform: translateY(-5px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 10px 0;
            font-weight: normal;
        }

        label {
            color: #2c3e50;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd6dd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #16a085;
            box-shadow: 0 0 0 3px rgba(22, 160, 133, 0.2);
        }

        button {
            background-color: #2c3e50;
            color: white;
            font-size: 15px;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 15px 6px 0;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background-color: #16a085;
            transform: scale(1.08);
        }

        /* Media queries (SAS) */
        @media (max-width: 600px) {
            h1 { font-size: 28px; }
            .form-card { padding: 25px 20px; }
            input[type="text"],
            input[type="password"] { font-size: 16px; }
        }

        @media (max-width: 480px) {
            .form-card { width: 100%; }
            button {
                display: block;
                width: 100%;
                margin: 12px 0 0;
                padding: 12px;
            }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            h1 { margin-bottom: 15px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <a class="home-link" href="index.html">← HOME</a>
    <h1>LOG IN</h1>

    <div class="form-card">
        <form action="display.html">
            <table>
                <tr>
                    <th><label for="username">UserName:</label></th>
                </tr>
                <tr>
                    <th><input type="text" id="username" name="username" placeholder="Enter your userName" required></th>
                </tr>
                <tr>
                    <th><label for="password">Password:</label></th>
                </tr>
                <tr>
                    <th><input type="password" id="password" name="password" placeholder="Enter your Password" required></th>
                </tr>
                <tr>
                    <th>
                        <button type="submit">Log in</button>
                        <button type="submit" formaction="register.html">Sign up</button>
                    </th>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
