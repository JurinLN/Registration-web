<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME PAGE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef3f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 42px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.35);
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-in both;
        }

        /* Flexible images (SAS) */
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Nav cards: CSS Grid, 3 -> 2 -> 1 columns */
        .nav-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin: 30px auto 40px;
            width: 90%;
            max-width: 900px;
        }

        .nav-card {
            background-color: #ffffff;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
            padding: 30px 25px;
            box-sizing: border-box;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            animation: fadeInUp 0.8s ease-in both;
        }

        .nav-card:nth-child(2) { animation-delay: 0.15s; }
        .nav-card:nth-child(3) { animation-delay: 0.3s; }

        .nav-card:hover {
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.3);
            transform: translateY(-8px) scale(1.04);
        }

        .nav-card a {
            display: inline-block;
            color: #2c3e50;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }

        .nav-card:hover a {
            color: #16a085;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        p {
            color: #444;
            max-width: 600px;
            margin: 10px auto;
        }

        .logo-link {
            display: inline-block;
        }

        .logo-link img {
            width: 150px;
            border-radius: 50%;
            border: 4px solid #16a085;
            opacity: 0.85;
            animation: spinLogo 4s linear infinite;
            transition: opacity 0.35s ease;
        }

        /* Stop the spinning when the cursor hovers over the logo */
        .logo-link:hover img {
            opacity: 1;
            animation-play-state: paused;
        }

        @keyframes spinLogo {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Media queries (SAS) */
        @media (min-width: 1024px) {
            .nav-container { max-width: 1000px; }
        }

        @media (max-width: 768px) {
            .nav-container { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 30px; }
        }

        @media (max-width: 480px) {
            .nav-container { grid-template-columns: 1fr; }
            .nav-card a { display: block; padding: 6px 0; }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            h1 { margin-bottom: 15px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <h1>HOME WEBSITE</h1>

    <div class="nav-container">
        <div class="nav-card"><a href="login.html">LOG IN</a></div>
        <div class="nav-card"><a href="register.html">REGISTRATION</a></div>
        <div class="nav-card"><a href="display.html">STUDENT INFORMATION</a></div>
    </div>

    <p>Click the image below to visit the official Cebu Technological University website.</p>
    <p>The image serves as a visual hyperlink for quick access to university information and resources.</p>

    <a class="logo-link" href="https://www.ctu.edu.ph" target="_blank">
        <picture>
            <source media="(max-width: 600px)" srcset="ctu-mobile.jpg">
            <img src="ctu-mobile.jpg" alt="CTU Website">
        </picture>
    </a>
</body>
</html>
